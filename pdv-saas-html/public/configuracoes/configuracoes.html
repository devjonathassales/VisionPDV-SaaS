<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações | VisionWare SaaS PDV</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Cabeçalho -->
    <header class="bg-green-700 text-white text-center py-4 shadow-md">
      <h1 class="text-3xl font-bold">Configurações</h1>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-6 max-w-4xl mx-auto w-full space-y-6">
      <!-- Tema -->
      <section class="bg-white rounded-lg shadow p-4">
        <h2 class="text-xl font-semibold mb-2 text-green-700">Tema</h2>
        <select class="w-full border rounded p-2">
          <option value="claro">Claro</option>
          <option value="escuro">Escuro</option>
        </select>
      </section>

      <!-- Padrões de Impressão -->
      <section class="bg-white rounded-lg shadow p-4">
        <h2 class="text-xl font-semibold mb-2 text-green-700">
          Padrões de Impressão
        </h2>
        <label class="block text-gray-700 mb-1">Tipo de Impressão:</label>
        <select class="w-full border rounded p-2 mb-2">
          <option>Não Fiscal</option>
          <option>Fiscal (ECF)</option>
          <option>Impressão Simples</option>
        </select>
        <label class="block text-gray-700 mb-1">Copias Padrão:</label>
        <input
          type="number"
          class="w-full border rounded p-2"
          placeholder="1"
        />
      </section>

      <!-- Formas de Pagamento -->
      <section class="bg-white rounded-lg shadow p-4">
        <h2 class="text-xl font-semibold mb-2 text-green-700">
          Formas de Pagamento
        </h2>
        <div class="flex flex-col gap-2">
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" class="accent-green-700" /> Dinheiro
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" class="accent-green-700" /> Cartão de Crédito
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" class="accent-green-700" /> Cartão de Débito
          </label>
          <label class="inline-flex items-center gap-2">
            <input type="checkbox" class="accent-green-700" /> Pix
          </label>
        </div>
      </section>

      <!-- Dados Fiscais -->
      <section class="bg-white rounded-lg shadow p-4">
        <h2 class="text-xl font-semibold mb-2 text-green-700">Dados Fiscais</h2>
        <label class="block text-gray-700 mb-1">CNPJ:</label>
        <input
          type="text"
          class="w-full border rounded p-2 mb-2"
          placeholder="00.000.000/0001-00"
        />

        <label class="block text-gray-700 mb-1">Inscrição Estadual:</label>
        <input
          type="text"
          class="w-full border rounded p-2"
          placeholder="Digite a inscrição estadual"
        />
      </section>

      <!-- Botão Salvar -->
      <div class="text-right">
        <button
          class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded shadow"
        >
          Salvar Configurações
        </button>
      </div>
    </main>

    <!-- Rodapé -->
    <footer class="bg-green-700 text-center text-white py-3">
      © 2025 - VisionWare SaaS PDV
    </footer>
  </body>
</html>
