<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Categorias</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-gray-100 p-6">
    <!-- Bloco Principal -->
    <div class="bg-white p-6 rounded-lg shadow-md mb-6">
      <h1 class="text-2xl font-semibold text-green-600 mb-6">
        Cadastro de Categorias
      </h1>

      <!-- Filtros e Botão -->
      <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
        <input
          type="text"
          placeholder="Buscar categoria..."
          class="border border-gray-300 rounded-md p-2 w-full sm:w-1/3"
        />

        <button
          onclick="toggleCategoriaForm()"
          class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600 transition"
        >
          + Nova Categoria
        </button>
      </div>

      <!-- Tabela de Categorias -->
      <div class="overflow-x-auto">
        <table class="min-w-full bg-white border border-gray-200 text-sm">
          <thead>
            <tr class="bg-gray-100 text-gray-700 text-left">
              <th class="px-4 py-2 border-b">Nome da Categoria</th>
              <th class="px-4 py-2 border-b text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-2 border-b">Mobília</td>
              <td class="px-4 py-2 border-b text-center">
                <div
                  class="flex justify-center items-center gap-3 whitespace-nowrap"
                >
                  <button
                    title="Visualizar"
                    class="text-green-600 hover:text-green-800 text-lg"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                  <button
                    title="Editar"
                    class="text-yellow-500 hover:text-yellow-700 text-lg"
                  >
                    <i class="fas fa-pen"></i>
                  </button>
                  <button
                    title="Excluir"
                    class="text-red-600 hover:text-red-800 text-lg"
                  >
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Formulário Oculto -->
    <section
      id="formCategoria"
      class="hidden bg-white p-6 rounded-lg shadow-md"
    >
      <h2 class="text-xl font-semibold mb-4 text-green-600">Nova Categoria</h2>

      <form class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-gray-700"
            >Nome da Categoria</label
          >
          <input
            type="text"
            class="mt-1 p-2 w-full border border-gray-300 rounded"
            placeholder="Digite o nome da categoria"
          />
        </div>

        <div class="sm:col-span-2 flex justify-end gap-2 mt-4">
          <button
            type="submit"
            class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
          >
            Salvar
          </button>
          <button
            type="reset"
            class="bg-gray-300 text-gray-800 px-4 py-2 rounded hover:bg-gray-400"
          >
            Cancelar
          </button>
        </div>
      </form>
    </section>

    <!-- Script -->
    <script>
      function toggleCategoriaForm() {
        const form = document.getElementById("formCategoria");
        form.classList.toggle("hidden");
      }
    </script>
  </body>
</html>
